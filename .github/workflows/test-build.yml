name: Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - test-ci
      - test/**
  pull_request:
    branches:
      - master

jobs:
  build_binaries:
    name: Test Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          mkdir -p .cargo
          sudo apt-get update
          
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              LINKER="aarch64-linux-gnu-gcc"
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y musl-tools
              LINKER="musl-gcc"
              ;;
            aarch64-unknown-linux-musl)
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
              LINKER="aarch64-linux-gnu-gcc"
              ;;
          esac
          
          echo "[target.${{ matrix.target }}]" >> .cargo/config.toml
          echo "linker = \"$LINKER\"" >> .cargo/config.toml

      - name: Build binary
        run: cargo build --bins --release --target ${{ matrix.target }}

      - name: Verify binary exists
        run: |
          echo "Checking for built binaries..."
          ls -lh target/${{ matrix.target }}/release/
          
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.targets[] | .kind[] == "bin") | .name'); do
            BIN_PATH="target/${{ matrix.target }}/release/$crate"
            if [ -f "$BIN_PATH" ]; then
              echo "✅ Found: $BIN_PATH"
              file "$BIN_PATH"
            else
              echo "❌ Missing: $BIN_PATH"
              exit 1
            fi
          done

      - name: Test binary (native targets only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || (startsWith(matrix.os, 'macos') && contains(matrix.target, runner.arch))
        run: |
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.targets[] | .kind[] == "bin") | .name'); do
            BIN_PATH="target/${{ matrix.target }}/release/$crate"
            if [ -f "$BIN_PATH" ]; then
              echo "Testing: $BIN_PATH"
              "$BIN_PATH" --help || true
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/env-mapper*
          retention-days: 7

  test_docs:
    name: Test Documentation Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

      - name: Verify docs generated
        run: |
          echo "Checking documentation output..."
          ls -la target/doc/
          
          if [ -d "target/doc/dyson_http" ]; then
            echo "✅ dyson_http docs generated"
          else
            echo "❌ dyson_http docs missing"
            exit 1
          fi
          
          if [ -d "target/doc/dyson_log" ]; then
            echo "✅ dyson_log docs generated"
          else
            echo "❌ dyson_log docs missing"
            exit 1
          fi

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc/
          retention-days: 7

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build_binaries, test_docs]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "## 🧪 Test Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Binaries: ${{ needs.build_binaries.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ${{ needs.test_docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build_binaries.result }}" == "success" ] && [ "${{ needs.test_docs.result }}" == "success" ]; then
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Ready to create a release tag!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

