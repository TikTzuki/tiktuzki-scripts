name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --bin fe-env-mapper --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          binary_name="fe-env-mapper"
          ext=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ext=".exe"
          fi
          cp "target/${{ matrix.target }}/release/${binary_name}${ext}" "artifacts/${binary_name}-${{ matrix.target }}${ext}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt