name: Release Binaries

on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy_binaries:
    name: Build for ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            type: macos
          - os: macos-latest
            target: aarch64-apple-darwin
            type: macos
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            type: linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            type: linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            type: linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            type: linux

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure Build (Fix linux-gnu image bug)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cat >> Cross.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:latest"
          EOF

      - name: Build binary (macOS)
        if: matrix.type == 'macos'
        run: |
          cargo build --bins --release --target ${{ matrix.target }}

      - name: Build binary (Linux)
        if: matrix.type == 'linux'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --bins --release --target ${{ matrix.target }}

      - name: Collect binary artifacts
        run: |
          mkdir -p artifacts
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.targets[] | .kind[] == "bin") | .name'); do
            BIN_PATH="target/${{ matrix.target }}/release/$crate"
            if [ -f "$BIN_PATH" ]; then
              cp "$BIN_PATH" "artifacts/${crate}-${{ matrix.target }}"
            fi
          done

      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
