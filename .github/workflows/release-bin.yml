name: Release Binaries

on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy_binaries:
    name: Build for ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          mkdir -p .cargo
          sudo apt-get update
          
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              LINKER="aarch64-linux-gnu-gcc"
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y musl-tools
              LINKER="x86_64-linux-musl-gcc"
              ;;
            aarch64-unknown-linux-musl)
              sudo apt-get install -y musl-tools
              LINKER="aarch64-linux-musl-gcc"
              echo "cc = \"aarch64-linux-musl-gcc\"" >> .cargo/config.toml
              echo "cxx = \"aarch64-linux-musl-g++\"" >> .cargo/config.toml
              echo "ar = \"aarch64-linux-musl-ar\"" >> .cargo/config.toml
              ;;
          esac
          
          echo "[target.${{ matrix.target }}]" >> .cargo/config.toml
          echo "linker = \"$LINKER\"" >> .cargo/config.toml

      - name: Build binary
        run: cargo build --bins --release --target ${{ matrix.target }}

      - name: Collect binary artifacts
        run: |
          mkdir -p artifacts
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.targets[] | .kind[] == "bin") | .name'); do
            BIN_PATH="target/${{ matrix.target }}/release/$crate"
            if [ -f "$BIN_PATH" ]; then
              cp "$BIN_PATH" "artifacts/${crate}-${{ matrix.target }}"
            fi
          done

      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
