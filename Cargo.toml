[workspace]
members = [
    "examples/*",
    "crates/*",
]

[workspace.package]
version = "0.0.8"
edition = "2024"
rust-version = "1.90"
authors = ["TikTuzki"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/TikTzuki/tiktuzki-scripts"
repository = "https://github.com/TikTzuki/tiktuzki-scripts"
exclude = ["benches/", "tests/", "testdata/", "examples/*"]

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rustdoc.all = "warn"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = "4"
futures = "0.3"
serde_json = "1"
serde = { version = "1" }
tokio = "1.47"
dotenvy = "0.15"

config = "0.15"
env-file-reader = { version = "0" }
fs_extra = { version = "1" }
walkdir = { version = "2" }

axum = "0.8"
axum-swagger-ui = { version = "0.3" }
aide = { version = "0" }
tower = "0.5"
utoipa = { version = "5" }
utoipa-swagger-ui = { version = "9" }
utoipa-axum = { version = "0" }
utoipa-redoc = { version = "6" }
utoipa-rapidoc = { version = "6" }
utoipa-scalar = { version = "0" }
tracing-subscriber = { version = "0.3" }
tracing-appender = { version = "0.2" }
console-subscriber = { version = "0.4" }
paste = "1"
once_cell = "1"
tempfile = "3"
envtestkit = "1"