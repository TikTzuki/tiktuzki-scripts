[workspace]
members = [
    "examples/env-mapper",
    "fe-env-mapper",
]

[workspace.dependencies]
anyhow = "1.0"
asyncapiv3 = "0.1"
async-nats = "0.42.0"
async-rate-limiter = { version = "1.0", features = ["rt-tokio"] }
async-trait = "0.1"
axum = "0.7"
bincode = "2"
bytes = "1.10.1"
chrono = "0.4.41"
clap = "4.5.6"
config = "0.15"
console-subscriber = "0.1.10"
env_logger = "0.11.8"
futures = "0.3.31"
keycloak = "26"
log = "0.4.17"
once_cell = "1.21.3"
prometheus-client = "0.23.1"
rand = "0.8"
rdkafka = { version = "0.38.0", features = ["cmake-build", "tokio"] }
redis = { version = "0.32.5", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tempfile = "3.0"
tokio = "1.47.0"
tokio-console = "0.1.13"
tokio-nats = "0.4.1"
tokio-tungstenite = "0.21.0"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2"
uuid = "1.17.0"
libp2p = "0.56.0"
libp2p-stream = { version = "0.4.0-alpha" }
binance = { git = "https://github.com/ccxt/binance-rs.git" }
jsonwebtoken = { version = "10" }
base64 = { version = "0.22" }
dotenvy = "0.15"